name: Agent control verification
on:
  push:
    branches: [feat/agent-operations-and-approvals]
  pull_request:
    paths:
      - 'src/lib/agent-access/**'
      - 'src/app/api/agent/**'
      - 'src/app/api/integrations/**'
      - 'tests/agent*'
      - '.github/workflows/agent-control.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Source checkpoint (tracked source only)
        run: |
          mkdir -p artifacts
          git archive --format=tar HEAD src scripts tests docs package.json package-lock.json tsconfig.json next.config.ts vitest.config.ts eslint.config.mjs > artifacts/zenith-source.tar
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test -- --no-file-parallelism
      - name: Prepare isolated integration tooling
        run: |
          mkdir -p "$RUNNER_TEMP/zenith-tooling"
          cd "$RUNNER_TEMP/zenith-tooling"
          npm init -y >/dev/null
          npm install --ignore-scripts --save-exact @modelcontextprotocol/server@2 @modelcontextprotocol/client@2 jose@6 esbuild@0.25 typescript@5.8.3 tsx@4 zod@3.25 vitest@3 @types/node@22
          tar -czf "$GITHUB_WORKSPACE/artifacts/zenith-tooling.tar.gz" package.json package-lock.json node_modules
      - name: Preserve private review checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-control-checkpoint-${{ github.sha }}
          retention-days: 1
          path: artifacts/
