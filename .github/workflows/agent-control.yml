name: Agent control verification
on:
  pull_request:
    paths:
      - 'src/lib/agent-access/**'
      - 'src/lib/actions/**'
      - 'src/app/api/agent/**'
      - 'src/app/api/integrations/**'
      - 'src/app/(product)/integrations/**'
      # The link flow: the credential authority, its three unauthenticated
      # endpoints, the approval screen, and the two migrations that carry the
      # `agent` schema. A change to any of them changes what a linked
      # credential is, so it belongs behind this gate. The first two are
      # already inside the two globs above; they are named anyway, so that
      # narrowing a parent glob later cannot silently drop them.
      - 'src/lib/agent-access/authority/**'
      - 'src/app/api/agent/link/**'
      - 'src/app/(product)/agent/**'
      - 'supabase/migrations/0006*'
      - 'supabase/migrations/0007*'
      - 'src/middleware.ts'
      - 'tests/agent*'
      - 'scripts/agent-*'
      - 'package*.json'
      - '.github/workflows/agent-control.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Same checkout SHA as ci.yml. This file used to pin 11d5960a (v4.2.2)
      # while ci.yml pinned v4.3.1; two pins for one action is two things to
      # audit and one of them is always the stale one.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The exact pin this file already carried, now shared by ci.yml.
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node scripts/test-agent-reader.mjs
      # `tests/agent-control` is a path filter, not a file: it matches the
      # `tests/agent-control-*.test.ts` files and the `tests/agent-control/`
      # directory the Postgres contract suite lives in. That suite has no
      # database here, so it skips itself loudly and is proved in ci.yml's
      # `postgres` job instead — the same split `tests/hosted/authority` uses.
      - run: npm test -- tests/agent-control --no-file-parallelism
      # The link flow: protocol, authority, routes, and the file-store journey
      # that ties them to a simulated deployment read back through the project
      # payload. Separate from the line above so that a failure names which
      # half of the feature broke.
      - run: npm test -- tests/agent-link tests/agent-journey.test.ts --no-file-parallelism
