name: CI

# The four gates that already existed in package.json and that nothing ran.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ORRERY_FAST: "1"

    steps:
      - uses: actions/checkout@v4

      # The runner context is unavailable in job-level env. Set the shared
      # scratch path after the runner starts, before any package scripts run.
      - name: Isolate verification data
        shell: bash
        run: echo "ORRERY_DATA=$RUNNER_TEMP/orrery-ci-data" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Smoke
        # scripts/smoke.ts sets its own ORRERY_DATA (.data-smoke) and clears it
        # on start, so this is end-to-end against a directory it owns.
        run: npm run smoke

  # Retain the existing optional build gate. Fonts now ship in public/fonts,
  # so compilation no longer depends on reaching Google Fonts.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

  # Proves the image still assembles: `output: "standalone"` is easy to break
  # from the outside (a new asset that nothing traces, a dependency that needs
  # a build tool the runner stage lacks) and nothing else in CI would notice.
  # Nothing is pushed — the image is built and discarded.
  #
  # Retain the existing optional image-build gate, matching `build` above.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # No NEXT_PUBLIC_* build args: this builds the local-demo-mode image on
      # purpose. Supplying Supabase keys here would only inline a project's
      # public URL into an artifact CI then throws away.
      - name: Build image (no push)
        run: docker build -t orrery:ci .
