name: CI

# Required verification, production build and image assembly gates.
on:
  push:
    branches: ["**"]
  pull_request:

# All jobs only read source; none publish artifacts or change the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Use an ignored directory in the disposable CI checkout. github.workspace
      # is available in job env; runner.temp is only available in later contexts.
      ORRERY_DATA: ${{ github.workspace }}/.data-ci
      ORRERY_FAST: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned workflow validator
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 15 --max-time 120 --output actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' 'actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP" actionlint

      - name: Validate workflow syntax
        run: '"$RUNNER_TEMP/actionlint" .github/workflows/ci.yml'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Smoke
        # scripts/smoke.ts sets its own ORRERY_DATA (.data-smoke) and clears it
        # on start, so this is end-to-end against a directory it owns.
        run: npm run smoke

      - name: Verify Gimbal assets
        run: npm run gimbal:verify

  # The hosted-apps path: every hosted suite, the twelve-gate acceptance
  # record, and the end-to-end journey script. Kept out of `verify` because it
  # runs real Vite builds through the recipe-local runner and needs its own
  # data directory; a failure here is a hosted release gate, not a flake.
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Its own ignored directory in the disposable CI checkout. Every hosted
      # suite and both scripts pin ORRERY_DATA themselves; this is the backstop
      # that keeps anything which forgot to from reaching .data.
      ORRERY_DATA: ${{ github.workspace }}/.data-ci-hosted
      ORRERY_FAST: "1"
      # Real builds, real runtime. Without these the pipeline refuses to build
      # at all, which would turn every gate into a skipped one.
      ZENITH_BUILD_RUNNER: recipe-local
      ZENITH_RUNTIME: local

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Hosted suites
        run: npx vitest run tests/hosted

      - name: Hosted acceptance journey
        # scripts/hosted-acceptance.ts sets its own ORRERY_DATA
        # (.data-hosted-acceptance) and clears it on start.
        run: npx tsx scripts/hosted-acceptance.ts

      - name: Report the installed browser
        # Informational only, so it never fails the job: the gate-12 step below
        # is what decides, and it fails with its own message when no browser is
        # installed. Never `continue-on-error` — a skipped gate 12 would be a
        # green run that verified nothing in a rendering engine.
        shell: bash
        run: |
          set -uo pipefail
          google-chrome --version || microsoft-edge --version || echo "no Chrome or Edge on this runner; gate 12 will fail with exit 2"
          exit 0

      - name: Gate 12 - recipient journey in a real browser
        run: npx tsx scripts/hosted-browser.ts

  # Fonts ship in public/fonts, so this gate has no Google Fonts dependency.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

  # Proves the image still assembles: `output: "standalone"` is easy to break
  # from the outside (a new asset that nothing traces, a dependency that needs
  # a build tool the runner stage lacks) and nothing else in CI would notice.
  # Nothing is pushed — the image is built and discarded.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # No NEXT_PUBLIC_* build args: this builds the local-demo-mode image on
      # purpose. Supplying Supabase keys here would only inline a project's
      # public URL into an artifact CI then throws away.
      - name: Build image (no push)
        run: docker build -t orrery:ci .
