name: Landing visual QA

on:
  pull_request:
    paths:
      - 'src/app/_landing/**'
      - 'src/components/shell/**'
      - 'src/app/page.tsx'
      - 'public/cloud-logos/**'
      - 'public/fonts/**'
      - 'scripts/landing-polish-browser.ts'
      - '.github/workflows/landing-visual.yml'

permissions:
  contents: read

concurrency:
  group: landing-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify production landing in Chromium
        run: npx tsx scripts/landing-polish-browser.ts
        env:
          LANDING_QA_DIR: ${{ runner.temp }}/zenith-landing-visual
      - name: Save screenshots and browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zenith-landing-visual
          path: |
            ${{ runner.temp }}/zenith-landing-visual/*.png
            ${{ runner.temp }}/zenith-landing-visual/*.json
            ${{ runner.temp }}/zenith-landing-visual/server.log
          retention-days: 7
