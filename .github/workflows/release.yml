name: Release

# Verified release supply chain (PROD-OPS-09). Runs ONLY when a version tag is pushed: never on a branch push, a pull
# request or a manual dispatch, so a release cannot be produced from an unreviewed ref by accident.
#
# What it does, in order:
#   1. refuses a tag that is not a semantic version or whose commit is not on the default branch;
#   2. runs the same dependency gates CI runs (lockfile pins, complete audit) against the tagged commit;
#   3. builds the Go binaries (zenith-runner, zenithd) and the four container images as OCI archives;
#   4. generates a CycloneDX SBOM (npm lockfile, Go build info, Dockerfile inputs, built image digests);
#   5. checks the vulnerability triage records against that SBOM;
#   6. ONLY IF the release signing key is present in the protected `release` environment: signs the MACH-04 runner and
#      zenithd update manifests (when an update host is configured), writes SLSA v1 provenance, builds the verification
#      manifest and signs it with the signing:release purpose key;
#   7. verifies the finished bundle OFFLINE with scripts/supply-chain/zenith-verify-release.mjs against the PUBLIC keys
#      pinned in the repository variable ZENITH_RELEASE_PUBLIC_KEYS (never a key read from the bundle);
#   8. publishes a GitHub release only when step 7 passed.
#
# Without the signing key the run still builds and uploads the candidate, labelled UNSIGNED, and publishes nothing.
# Nothing here pushes an image to a registry: the images ship as OCI archives whose digests the verifier recomputes.
#
# Required (set by an operator; this workflow cannot create them):
#   secret   ZENITH_RELEASE_SIGNING_SEED   base64url Ed25519 seed of the signing:release key (environment `release`,
#                                          with required reviewers). The control plane never holds this key.
#   variable ZENITH_RELEASE_KEY_ID         key id the signature carries
#   variable ZENITH_RELEASE_PUBLIC_KEYS    JSON array of pinned public key entries [{"kid","publicKey"}]
#   variable ZENITH_UPDATE_BASE_URL        optional https URL under which operators host <version>/<os>-<arch>/<component>
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            go/go.mod
            go/go.sum

      - name: Tag is a semantic version on the default branch
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]{1,32})?$ ]] || { echo "tag $TAG is not a semantic version" >&2; exit 1; }
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}" || { echo "the tagged commit is not on ${DEFAULT_BRANCH}; refusing to release it" >&2; exit 1; }

      - name: Lockfile pins only registry tarballs with integrity hashes
        run: node scripts/ci/lockfile-integrity.mjs

      - name: Known dependency findings block release
        run: node scripts/ci/security-audit.mjs

      - name: Build Go binaries
        shell: bash
        env:
          GOTOOLCHAIN: local
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.27.1"
          (cd go && ./build.sh "${TAG#v}")
          mkdir -p release/go
          cp -R go/dist/. release/go/

      - name: Build container images as OCI archives
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p release/images
          docker buildx create --name zenith-release --driver docker-container --use
          build() {
            local name="$1" file="$2"; shift 2
            docker buildx build --file "$file" --build-arg "VERSION=${VERSION}" --build-arg "COMMIT=${GITHUB_SHA}" "$@" --output "type=oci,dest=release/images/${name}.oci.tar" .
          }
          build zenith Dockerfile
          build zenith-worker docker/worker.Dockerfile --target production
          build zenith-runner docker/runner.Dockerfile
          build zenithd docker/zenithd.Dockerfile

      - name: Generate the CycloneDX SBOM
        shell: bash
        env:
          GOTOOLCHAIN: local
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          images=()
          for name in zenith zenith-worker zenith-runner zenithd; do
            digest="$(node scripts/supply-chain/release.mjs oci-digest --archive "release/images/${name}.oci.tar")"
            images+=(--image "${name}=${digest}")
          done
          node scripts/supply-chain/sbom.mjs \
            --lock package-lock.json --package package.json \
            --go-binary release/go/linux-amd64/zenithd --go-binary release/go/linux-amd64/zenith-runner \
            --go-binary release/go/linux-arm64/zenithd --go-binary release/go/linux-arm64/zenith-runner \
            --dockerfile Dockerfile --dockerfile docker/worker.Dockerfile --dockerfile docker/runner.Dockerfile --dockerfile docker/zenithd.Dockerfile \
            "${images[@]}" \
            --version "${TAG#v}" --commit "$GITHUB_SHA" --out release/sbom.cdx.json

      - name: Vulnerability triage records match the SBOM and none has expired
        run: node scripts/ci/vulnerability-triage.mjs --sbom release/sbom.cdx.json

      - name: Is the release signing key available
        id: key
        shell: bash
        env:
          SEED: ${{ secrets.ZENITH_RELEASE_SIGNING_SEED }}
          KEY_ID: ${{ vars.ZENITH_RELEASE_KEY_ID }}
          PINNED: ${{ vars.ZENITH_RELEASE_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          if [ -n "$SEED" ] && [ -n "$KEY_ID" ] && [ -n "$PINNED" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release signing key, key id or pinned public keys are configured: this run produces an UNSIGNED candidate and publishes nothing."
          fi

      - name: Sign the runner and zenithd update manifests
        if: steps.key.outputs.present == 'true' && vars.ZENITH_UPDATE_BASE_URL != ''
        shell: bash
        env:
          GOTOOLCHAIN: local
          SEED: ${{ secrets.ZENITH_RELEASE_SIGNING_SEED }}
          KEY_ID: ${{ vars.ZENITH_RELEASE_KEY_ID }}
          BASE_URL: ${{ vars.ZENITH_UPDATE_BASE_URL }}
          TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          umask 077
          seed_file="$RUNNER_TEMP/release-seed"
          printf '%s\n' "$SEED" > "$seed_file"
          case "$TAG" in *-*) channel=prerelease ;; *) channel=stable ;; esac
          mkdir -p release/updater
          for component in zenith-runner zenithd; do
            (cd go && go run ./cmd/zenith-release sign --key "$seed_file" --kid "$KEY_ID" --component "$component" --channel "$channel" \
              --version "${TAG#v}" --seq "$RUN_NUMBER" --base-url "$BASE_URL" --dist dist --out "../release/updater/${component}.json")
          done
          rm -f "$seed_file"

      - name: Provenance, verification manifest and release signature
        if: steps.key.outputs.present == 'true'
        shell: bash
        env:
          SEED: ${{ secrets.ZENITH_RELEASE_SIGNING_SEED }}
          KEY_ID: ${{ vars.ZENITH_RELEASE_KEY_ID }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          seed_file="$RUNNER_TEMP/release-seed"
          printf '%s\n' "$SEED" > "$seed_file"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/supply-chain/release.mjs provenance --dir release --out release/provenance.intoto.json \
            --repository "$REPOSITORY" --commit "$GITHUB_SHA" --ref "$WORKFLOW_REF" --workflow .github/workflows/release.yml \
            --run-url "$RUN_URL" --lock package-lock.json --started "$started"
          images=()
          for name in zenith zenith-worker zenith-runner zenithd; do images+=(--image "${name}=images/${name}.oci.tar"); done
          node scripts/supply-chain/release.mjs manifest --dir release --out "$RUNNER_TEMP/manifest.json" \
            --tag "$TAG" --version "${TAG#v}" --commit "$GITHUB_SHA" --repository "$REPOSITORY" "${images[@]}"
          node scripts/supply-chain/release.mjs sign --manifest "$RUNNER_TEMP/manifest.json" --key "$seed_file" --kid "$KEY_ID" --out release/release-manifest.json
          rm -f "$seed_file"

      - name: Verify the release bundle offline against the pinned public keys
        if: steps.key.outputs.present == 'true'
        shell: bash
        env:
          PINNED: ${{ vars.ZENITH_RELEASE_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          printf '%s' "$PINNED" > "$RUNNER_TEMP/pinned-keys.json"
          node scripts/supply-chain/zenith-verify-release.mjs release --keys "$RUNNER_TEMP/pinned-keys.json" --lock package-lock.json

      - name: Label an unsigned candidate
        if: steps.key.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf 'UNSIGNED CANDIDATE. No release signature, provenance or verification manifest was produced; this is not a release.\n' > release/UNSIGNED.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.key.outputs.present == 'true' && 'release-signed' || 'release-UNSIGNED' }}-${{ github.ref_name }}
          path: release
          if-no-files-found: error
          retention-days: 30

      - name: Publish the signed release
        if: steps.key.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tar -C release -cf "$RUNNER_TEMP/zenith-${TAG}-bundle.tar" .
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" "${prerelease[@]}" --verify-tag --title "$TAG" \
            --notes "Verify offline with scripts/supply-chain/zenith-verify-release.mjs against the pinned release public keys (docs/platform/operations/SUPPLY-CHAIN.md). Provenance is workflow-asserted and bound by the release signature; it is not a Sigstore attestation." \
            "$RUNNER_TEMP/zenith-${TAG}-bundle.tar" release/release-manifest.json release/sbom.cdx.json release/provenance.intoto.json
