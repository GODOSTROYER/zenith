name: zenith-j15-${ZENITH_LOCAL_RUN_ID:?run id required}
services:
  localstack:
    image: localstack/localstack:4.8.1@sha256:8c9756bddc44625cd6e890f5e4bcc29b045eebe108b268482b848f4f832ec153
    profiles: [mixed]
    mem_limit: 768m
    cpus: 0.75
    environment:
      SERVICES: lambda,iam,sts
      DEBUG: "0"
      LAMBDA_LIMITS_CONCURRENT_EXECUTIONS: "1"
      LAMBDA_DOCKER_NETWORK: zenith-j15-${ZENITH_LOCAL_RUN_ID}-mixed
      LAMBDA_KEEPALIVE_MS: "60000"
    ports: ["127.0.0.1:14566:4566"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    networks: [mixed]
  challenge:
    image: node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    profiles: [acme]
    mem_limit: 96m
    cpus: 0.15
    command: [node, /fixture/challenge.mjs]
    volumes:
      - ${ZENITH_LOCAL_ROOT:?private scratch required}/challenge:/challenge:ro
      - ../../../fixtures/mixed-app/acme:/fixture:ro
    networks:
      acme: { ipv4_address: 172.30.115.10 }
  coredns:
    image: coredns/coredns:1.12.4@sha256:986f04c2e15e147d00bdd51e8c51bcef3644b13ff806be7d2ff1b261d6dfbae1
    profiles: [acme]
    mem_limit: 64m
    cpus: 0.1
    command: [-conf, /config/Corefile]
    volumes: ["./Corefile:/config/Corefile:ro"]
    networks:
      acme: { ipv4_address: 172.30.115.11 }
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.8.0@sha256:d9080f68f6cb6af8d82134ab26de0aaaf312ac9cba42aecc6d3aede6cb63007b
    profiles: [acme]
    mem_limit: 128m
    cpus: 0.2
    command: [-config, /config/pebble.json, -dnsserver, "172.30.115.11:53"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
    ports: ["127.0.0.1:14000:14000", "127.0.0.1:15000:15000"]
    volumes:
      - ./pebble.json:/config/pebble.json:ro
      - ${ZENITH_LOCAL_ROOT}/pki/pebble.crt:/pki/pebble.crt:ro
      - ${ZENITH_LOCAL_ROOT}/pki/pebble.key:/pki/pebble.key:ro
    networks: [acme]
  stripe:
    image: ${ZENITH_LOCAL_STRIPE_IMAGE:-stripe/stripe-mock:v0.203.0@sha256:50034484b1fc54208514859cf83808632cb01825eb488219d2eb2e589f3554d2}
    profiles: [billing]
    mem_limit: 128m
    cpus: 0.2
    ports: ["127.0.0.1:12111:12111"]
networks:
  mixed:
    name: zenith-j15-${ZENITH_LOCAL_RUN_ID}-mixed
  acme:
    ipam:
      config: [{ subnet: 172.30.115.0/24 }]
