AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Zenith connection. Creates keyless (OIDC) trust for one Zenith workspace and
  connection, a read-only observe role, a tag- and name-scoped deploy role with
  a permission boundary on everything it creates, a private versioned state
  bucket, and a CodeBuild role. No access keys, no secrets, no passwords.
  Delete this stack to revoke Zenith (see deploy/aws/README.md).

# ---------------------------------------------------------------------------
# How to read this template
#
#  * Zenith never receives a credential from you. It proves who it is with a
#    short-lived signed token (OpenID Connect) that only THIS role, for THIS
#    exact `sub`, will accept. `ZenithOidcSubject` is shown by Zenith when you
#    connect the account; paste it unchanged.
#  * Two roles, two jobs:
#      ZenithObserveRole  read-only. Describe/list/get. Cannot read secret
#                         values (secretsmanager:GetSecretValue is denied).
#      ZenithDeployRole   may create/change/delete ONLY resources that carry the
#                         tag zenith:managed=true (or are named zenith-*), and
#                         may create IAM roles ONLY with the ZenithWorkloadBoundary
#                         permission boundary attached. It cannot modify itself,
#                         the boundary, the OIDC provider or the state bucket's
#                         security settings.
#  * Every mutating action below is conditioned on the zenith:managed tag or
#    a zenith-* name. Read-only actions are unconditioned because most Describe
#    and List APIs do not support resource-level permissions.
#  * The template mirrors deploy/aws/tofu-module (same policy statements); a
#    test in the Zenith repository keeps the two in sync.
#
# Known limits (documented, not hidden):
#  * ecs:RegisterTaskDefinition / DeregisterTaskDefinition / DeleteTaskDefinitions
#    accept only Resource "*" in IAM; Zenith can add revisions to any task
#    definition family it can name, but it cannot change a running service of
#    yours (UpdateService is name/tag scoped).
#  * ec2:RunInstances on public images has no tag to condition on; the request
#    still fails unless the instance, volume and network interface are tagged
#    zenith:managed=true.
#  * iam:PassRole is limited to zenith-* roles for ecs-tasks, codebuild and
#    lambda. EC2 instance profiles are not enabled; extend deliberately.
# ---------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Zenith identity (shown by Zenith when you connect the account)" }
        Parameters: [ZenithIssuerHost, ZenithOidcSubject, CreateOidcProvider]
      - Label: { default: "Optional: Zenith control plane running on AWS (AssumeRole + ExternalId)" }
        Parameters: [ZenithPrincipalArn, ExternalId]
      - Label: { default: "Scope" }
        Parameters: [EnvironmentTagValue, NameSuffix, Route53HostedZoneArns]
      - Label: { default: "State bucket" }
        Parameters: [StateBucketKmsKeyArn]

Parameters:
  ZenithIssuerHost:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?$'
    Description: >-
      The Zenith OIDC issuer WITHOUT https:// — host and path, for example
      app.tryzenith.cloud/api/oidc. Leave empty only if you use AssumeRole mode.
  ZenithOidcSubject:
    Type: String
    Default: ""
    AllowedPattern: '^$|^zenith:ws:[A-Za-z0-9._-]{1,128}:conn:[A-Za-z0-9._-]{1,128}$'
    Description: >-
      The exact token subject Zenith will present, zenith:ws:<workspace>:conn:<connection>.
      Only tokens with this subject can assume the roles.
  CreateOidcProvider:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >-
      "yes" creates the IAM OIDC provider for the issuer. Choose "no" if it
      already exists in this account (one provider per issuer URL per account),
      for example because you already connected another Zenith workspace.
  ZenithPrincipalArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:aws(-cn|-us-gov)?:iam::[0-9]{12}:(root|role/.+|user/.+)$'
    Description: >-
      Only for a Zenith control plane that itself runs on AWS: the principal
      allowed to call sts:AssumeRole. Leave empty for the OIDC path.
  ExternalId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9+=,.@:/_-]{2,1224}$'
    Description: >-
      Per-connection ExternalId generated by Zenith; required with ZenithPrincipalArn
      (prevents the confused-deputy problem). Not a password.
  EnvironmentTagValue:
    Type: String
    Default: "*"
    AllowedPattern: '^[A-Za-z0-9_.:/=+@*-]{1,128}$'
    Description: >-
      Scope of the deploy role. "*" allows any Zenith environment (any resource
      tagged zenith:managed=true). An exact value, for example the id of one
      Zenith environment, confines the role to resources tagged
      zenith:environment=<value>.
  NameSuffix:
    Type: String
    Default: ""
    AllowedPattern: '^(-[a-z0-9-]{1,19})?$'
    Description: >-
      Optional suffix, starting with a hyphen, that lets several Zenith
      connections coexist in one account (for example -team-a). Empty for one.
  Route53HostedZoneArns:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Hosted zones Zenith may change DNS records in, as ARNs
      (arn:aws:route53:::hostedzone/Z123...). Leave empty to give Zenith no DNS
      write access at all.
  StateBucketKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:aws(-cn|-us-gov)?:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+$'
    Description: >-
      Optional customer-managed KMS key for the state bucket (SSE-KMS). Empty
      uses AES256 (SSE-S3). The key policy must allow this account's IAM.

Rules:
  TrustIsConfigured:
    Assertions:
      - Assert: !Or
          - !Not [!Equals [!Ref ZenithIssuerHost, ""]]
          - !Not [!Equals [!Ref ZenithPrincipalArn, ""]]
        AssertDescription: Set ZenithIssuerHost (OIDC) or ZenithPrincipalArn (AssumeRole); otherwise nobody can assume the roles.
  OidcNeedsSubject:
    RuleCondition: !Not [!Equals [!Ref ZenithIssuerHost, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref ZenithOidcSubject, ""]]
        AssertDescription: ZenithOidcSubject is required with ZenithIssuerHost.
  AssumeRoleNeedsExternalId:
    RuleCondition: !Not [!Equals [!Ref ZenithPrincipalArn, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExternalId, ""]]
        AssertDescription: ExternalId is required with ZenithPrincipalArn.

Conditions:
  HasOidc: !Not [!Equals [!Ref ZenithIssuerHost, ""]]
  CreateProvider: !And
    - !Not [!Equals [!Ref ZenithIssuerHost, ""]]
    - !Equals [!Ref CreateOidcProvider, "yes"]
  HasAssumeRole: !Not [!Equals [!Ref ZenithPrincipalArn, ""]]
  HasKmsKey: !Not [!Equals [!Ref StateBucketKmsKeyArn, ""]]
  HasHostedZones: !Not [!Equals [!Join ["", !Ref Route53HostedZoneArns], ""]]

Resources:
  # ------------------------------------------------------------------ OIDC
  # The IAM OIDC provider that lets AWS verify Zenith's tokens. IAM fetches
  # <issuer>/.well-known/openid-configuration and the JWKS itself; the issuer
  # must be reachable over public HTTPS. ThumbprintList is omitted: IAM
  # validates providers on public CAs with its own trusted CA library.
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: !Sub "https://${ZenithIssuerHost}"
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - { Key: "zenith:bootstrap", Value: "true" }

  # ----------------------------------------------------------- state bucket
  # OpenTofu state and build artifacts. Versioned, private, encrypted, TLS
  # only. It is NOT tagged zenith:managed, so the deploy role cannot reconfigure
  # or delete it (explicit denies in ZenithDeployState as well). Deleting this
  # stack keeps the bucket: your state is yours.
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "zenith-state-${AWS::AccountId}-${AWS::Region}${NameSuffix}"
      VersioningConfiguration: { Status: Enabled }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: !If [HasKmsKey, true, !Ref "AWS::NoValue"]
            ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [HasKmsKey, "aws:kms", "AES256"]
              KMSMasterKeyID: !If [HasKmsKey, !Ref StateBucketKmsKeyArn, !Ref "AWS::NoValue"]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 180 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      Tags:
        - { Key: "zenith:bootstrap", Value: "true" }

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt StateBucket.Arn, !Sub "${StateBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - Sid: DenyTlsBelow12
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt StateBucket.Arn, !Sub "${StateBucket.Arn}/*"]
            Condition: { NumericLessThan: { "s3:TlsVersion": "1.2" } }

  # ------------------------------------------------- permission boundary
  # Every IAM role Zenith creates must carry this boundary. Effective
  # permissions of such a role = its own policies INTERSECT this list, so even a
  # role Zenith attaches AdministratorAccess to cannot exceed it. It grants
  # workload-level access (logs, image pull, zenith-* buckets/queues, secret
  # READS for injection). IAM is denied except events roles passing ECS task
  # roles; Organizations, Account and the state bucket are always denied.
  # Build/events/EC2 grants use reserved suffixes defined in naming.ts;
  # generate-tofu-policies.ts checks the principal patterns for drift.
  WorkloadBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: ZenithWorkloadBoundary${NameSuffix}
      Description: Permission boundary for roles created by Zenith. Do not edit; Zenith cannot.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
              - ecr:DescribeImages
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/zenith-*
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-build
          - Effect: Allow
            Action: s3:GetObjectVersion
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::zenith-*/*
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-build
              StringEquals:
                s3:ResourceAccount:
                  Ref: AWS::AccountId
          - Effect: Allow
            Action: cloudfront:CreateInvalidation
            Resource:
              Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-build
              StringEquals:
                aws:ResourceTag/zenith:managed: 'true'
          - Effect: Allow
            Action: ecs:RunTask
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:task-definition/zenith-*
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-events
                ecs:cluster:
                  Fn::Sub: arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:cluster/zenith-*
          - Effect: Allow
            Action: iam:PassRole
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-events
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com
          - Effect: Allow
            Action:
              - ssm:UpdateInstanceInformation
              - ssm:ListInstanceAssociations
              - ssm:PutComplianceItems
              - ssm:DescribeAssociation
              - ssm:Update*AssociationStatus
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-ec2
              StringEquals:
                aws:ResourceTag/zenith:managed: 'true'
          - Effect: Allow
            Action:
              - ec2:AttachNetworkInterface
              - ec2:DetachNetworkInterface
              - ec2:ModifyNetworkInterfaceAttribute
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*
            Condition:
              StringEquals:
                aws:ResourceTag/zenith:managed: 'true'
              StringLike:
                aws:ResourceTag/zenith:environment:
                  Ref: EnvironmentTagValue
          - Effect: Allow
            Action: ec2:CreateTags
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:network-interface/*
            Condition:
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - node.k8s.amazonaws.com/instance_id
                  - node.k8s.amazonaws.com/createdAt
                  - cluster.k8s.amazonaws.com/name
                  - eks:eni:owner
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                kms:CallerAccount:
                  Ref: AWS::AccountId
              StringLike:
                kms:ViaService:
                  - secretsmanager.*.amazonaws.com
                  - ssm.*.amazonaws.com
                  - s3.*.amazonaws.com
                  - sqs.*.amazonaws.com
                  - sns.*.amazonaws.com
                  - ec2.*.amazonaws.com
                  - eks.*.amazonaws.com
          - Effect: Deny
            Action: iam:*
            Resource: '*'
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-events
          - Effect: Deny
            Action:
              - organizations:*
              - account:*
              - iam:*
            Resource: '*'
            Condition:
              StringNotEqualsIfExists:
                iam:PassedToService: ecs-tasks.amazonaws.com
          - Effect: Deny
            Action: s3:*
            # Covers this bucket and its objects; also protects bucket-name
            # prefix collisions. This only strengthens the legacy explicit deny.
            Resource:
              Fn::Sub: ${StateBucket.Arn}*
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogStreams
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - eks:DescribeCluster
              - eks-auth:AssumeRoleForPodIdentity
              - ec2:AttachNetworkInterface
              - ec2:DetachNetworkInterface
              - ec2:ModifyNetworkInterfaceAttribute
              - kms:DescribeKey
              - sns:Publish
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:ChangeMessageVisibility
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/zenith/*
              - Fn::Sub: arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/*/zenith-*
              - Fn::Sub: arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/zenith-*
              - Fn::Sub: arn:${AWS::Partition}:ecr:*:*:repository/eks/*
              - Fn::Sub: arn:${AWS::Partition}:ecr:*:*:repository/amazon-k8s-cni
              - Fn::Sub: arn:${AWS::Partition}:eks:*:${AWS::AccountId}:cluster/zenith-${EnvironmentTagValue}-*
              - Fn::Sub: arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:network-interface/*
              - Fn::Sub: arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*
              - Fn::Sub: arn:${AWS::Partition}:sns:*:${AWS::AccountId}:zenith-${EnvironmentTagValue}-*
              - Fn::Sub: arn:${AWS::Partition}:s3:::zenith-*
              - Fn::Sub: arn:${AWS::Partition}:s3:::zenith-*/*
              - Fn::Sub: arn:${AWS::Partition}:sqs:*:${AWS::AccountId}:zenith-*
              - Fn::Sub: arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:zenith/*
              - Fn::Sub: arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/zenith/*
          - Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ec2:DescribeInstances
              - ec2:DescribeInstanceTypes
              - ec2:DescribeRouteTables
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVolumes
              - ec2:DescribeVolumesModifications
              - ec2:DescribeVpcs
              - ec2:DescribeTags
              - ec2:DescribeAvailabilityZones
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'
          - Effect: Allow
            Action:
              - ssm:ListAssociations
              - ssm:GetManifest
              - ssm:PutInventory
              - ssm:PutConfigurePackageResult
              - ssm:GetDeployablePatchSnapshotForInstance
              - ec2messages:GetEndpoint
              - ec2messages:GetMessages
              - ec2messages:SendReply
              - ssmmessages:*Channel
              - ec2messages:*Message
            Resource: '*'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-ec2
          - Effect: Allow
            Action:
              - ssm:DescribeAssociation
              - ssm:Update*AssociationStatus
              - ssm:GetDocument
              - ssm:DescribeDocument
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:association/*
              - Fn::Sub: arn:${AWS::Partition}:ssm:*::document/*
              - Fn::Sub: arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:document/Zenith-*
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-ec2
  # Family boundaries enforce reserved principals as well as action/resource scopes.
  AppBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: ZenithAppBoundary${NameSuffix}
      Description: Permission boundary for Zenith app roles. Do not edit; Zenith cannot.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogStreams
              - logs:FilterLogEvents
              - logs:GetLogEvents
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:ChangeMessageVisibility
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/zenith/*
              - Fn::Sub: arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/*/zenith-*
              - Fn::Sub: arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/zenith-*
              - Fn::Sub: arn:${AWS::Partition}:sqs:*:${AWS::AccountId}:zenith-*
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-role
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-exec
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-fn
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-flow
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-role
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-exec
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-fn
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-flow
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:AbortMultipartUpload
              - s3:ListMultipartUploadParts
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::zenith-*
              - Fn::Sub: arn:${AWS::Partition}:s3:::zenith-*/*
            Condition:
              StringEquals:
                s3:ResourceAccount:
                  Ref: AWS::AccountId
              ArnLike:
                aws:PrincipalArn:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-role
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-exec
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-fn
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-flow
          - Effect: Allow
            Action: sns:Publish
            Resource:
              Fn::Sub: arn:${AWS::Partition}:sns:*:${AWS::AccountId}:zenith-${EnvironmentTagValue}-*
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-role
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-exec
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-fn
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-flow
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:zenith/*
              - Fn::Sub: arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:rds!db-*
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-role
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-exec
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-fn
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-flow
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/zenith/*
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-role
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-exec
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-fn
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*-flow
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource:
              Fn::Sub: arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*
            Condition:
              StringEquals:
                kms:CallerAccount:
                  Ref: AWS::AccountId
              StringLike:
                kms:ViaService:
                  - Fn::Sub: secretsmanager.*.${AWS::URLSuffix}
                  - Fn::Sub: ssm.*.${AWS::URLSuffix}
                  - Fn::Sub: s3.*.${AWS::URLSuffix}
