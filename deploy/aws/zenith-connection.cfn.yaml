AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Zenith connection. Creates keyless (OIDC) trust for one Zenith workspace and
  connection, a read-only observe role, a tag- and name-scoped deploy role with
  a permission boundary on everything it creates, a private versioned state
  bucket, and a CodeBuild role. No access keys, no secrets, no passwords.
  Delete this stack to revoke Zenith (see deploy/aws/README.md).

# ---------------------------------------------------------------------------
# How to read this template
#
#  * Zenith never receives a credential from you. It proves who it is with a
#    short-lived signed token (OpenID Connect) that only THIS role, for THIS
#    exact `sub`, will accept. `ZenithOidcSubject` is shown by Zenith when you
#    connect the account; paste it unchanged.
#  * Two roles, two jobs:
#      ZenithObserveRole  read-only. Describe/list/get. Cannot read secret
#                         values (secretsmanager:GetSecretValue is denied).
#      ZenithDeployRole   may create/change/delete ONLY resources that carry the
#                         tag zenith:managed=true (or are named zenith-*), and
#                         may create IAM roles ONLY with the ZenithWorkloadBoundary
#                         permission boundary attached. It cannot modify itself,
#                         the boundary, the OIDC provider or the state bucket's
#                         security settings.
#  * Every mutating action below is conditioned on the zenith:managed tag or
#    a zenith-* name. Read-only actions are unconditioned because most Describe
#    and List APIs do not support resource-level permissions.
#  * The template mirrors deploy/aws/tofu-module (same policy statements); a
#    test in the Zenith repository keeps the two in sync.
#
# Known limits (documented, not hidden):
#  * ecs:RegisterTaskDefinition / DeregisterTaskDefinition / DeleteTaskDefinitions
#    accept only Resource "*" in IAM; Zenith can add revisions to any task
#    definition family it can name, but it cannot change a running service of
#    yours (UpdateService is name/tag scoped).
#  * ec2:RunInstances on public images has no tag to condition on; the request
#    still fails unless the instance, volume and network interface are tagged
#    zenith:managed=true.
#  * iam:PassRole is limited to zenith-* roles for ecs-tasks, codebuild and
#    lambda. EC2 instance profiles are not enabled; extend deliberately.
# ---------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Zenith identity (shown by Zenith when you connect the account)" }
        Parameters: [ZenithIssuerHost, ZenithOidcSubject, CreateOidcProvider]
      - Label: { default: "Optional: Zenith control plane running on AWS (AssumeRole + ExternalId)" }
        Parameters: [ZenithPrincipalArn, ExternalId]
      - Label: { default: "Scope" }
        Parameters: [EnvironmentTagValue, NameSuffix, Route53HostedZoneArns]
      - Label: { default: "State bucket" }
        Parameters: [StateBucketKmsKeyArn]

Parameters:
  ZenithIssuerHost:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?$'
    Description: >-
      The Zenith OIDC issuer WITHOUT https:// — host and path, for example
      app.tryzenith.cloud/api/oidc. Leave empty only if you use AssumeRole mode.
  ZenithOidcSubject:
    Type: String
    Default: ""
    AllowedPattern: '^$|^zenith:ws:[A-Za-z0-9._-]{1,128}:conn:[A-Za-z0-9._-]{1,128}$'
    Description: >-
      The exact token subject Zenith will present, zenith:ws:<workspace>:conn:<connection>.
      Only tokens with this subject can assume the roles.
  CreateOidcProvider:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >-
      "yes" creates the IAM OIDC provider for the issuer. Choose "no" if it
      already exists in this account (one provider per issuer URL per account),
      for example because you already connected another Zenith workspace.
  ZenithPrincipalArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:aws(-cn|-us-gov)?:iam::[0-9]{12}:(root|role/.+|user/.+)$'
    Description: >-
      Only for a Zenith control plane that itself runs on AWS: the principal
      allowed to call sts:AssumeRole. Leave empty for the OIDC path.
  ExternalId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9+=,.@:/_-]{2,1224}$'
    Description: >-
      Per-connection ExternalId generated by Zenith; required with ZenithPrincipalArn
      (prevents the confused-deputy problem). Not a password.
  EnvironmentTagValue:
    Type: String
    Default: "*"
    AllowedPattern: '^[A-Za-z0-9_.:/=+@*-]{1,128}$'
    Description: >-
      Scope of the deploy role. "*" allows any Zenith environment (any resource
      tagged zenith:managed=true). An exact value, for example the id of one
      Zenith environment, confines the role to resources tagged
      zenith:environment=<value>.
  NameSuffix:
    Type: String
    Default: ""
    AllowedPattern: '^(-[a-z0-9-]{1,19})?$'
    Description: >-
      Optional suffix, starting with a hyphen, that lets several Zenith
      connections coexist in one account (for example -team-a). Empty for one.
  Route53HostedZoneArns:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Hosted zones Zenith may change DNS records in, as ARNs
      (arn:aws:route53:::hostedzone/Z123...). Leave empty to give Zenith no DNS
      write access at all.
  StateBucketKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:aws(-cn|-us-gov)?:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+$'
    Description: >-
      Optional customer-managed KMS key for the state bucket (SSE-KMS). Empty
      uses AES256 (SSE-S3). The key policy must allow this account's IAM.

Rules:
  TrustIsConfigured:
    Assertions:
      - Assert: !Or
          - !Not [!Equals [!Ref ZenithIssuerHost, ""]]
          - !Not [!Equals [!Ref ZenithPrincipalArn, ""]]
        AssertDescription: Set ZenithIssuerHost (OIDC) or ZenithPrincipalArn (AssumeRole); otherwise nobody can assume the roles.
  OidcNeedsSubject:
    RuleCondition: !Not [!Equals [!Ref ZenithIssuerHost, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref ZenithOidcSubject, ""]]
        AssertDescription: ZenithOidcSubject is required with ZenithIssuerHost.
  AssumeRoleNeedsExternalId:
    RuleCondition: !Not [!Equals [!Ref ZenithPrincipalArn, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExternalId, ""]]
        AssertDescription: ExternalId is required with ZenithPrincipalArn.

Conditions:
  HasOidc: !Not [!Equals [!Ref ZenithIssuerHost, ""]]
  CreateProvider: !And
    - !Not [!Equals [!Ref ZenithIssuerHost, ""]]
    - !Equals [!Ref CreateOidcProvider, "yes"]
  HasAssumeRole: !Not [!Equals [!Ref ZenithPrincipalArn, ""]]
  HasKmsKey: !Not [!Equals [!Ref StateBucketKmsKeyArn, ""]]
  HasHostedZones: !Not [!Equals [!Join ["", !Ref Route53HostedZoneArns], ""]]

Resources:
  # ------------------------------------------------------------------ OIDC
  # The IAM OIDC provider that lets AWS verify Zenith's tokens. IAM fetches
  # <issuer>/.well-known/openid-configuration and the JWKS itself; the issuer
  # must be reachable over public HTTPS. ThumbprintList is omitted: IAM
  # validates providers on public CAs with its own trusted CA library.
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: !Sub "https://${ZenithIssuerHost}"
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - { Key: "zenith:bootstrap", Value: "true" }

  # ----------------------------------------------------------- state bucket
  # OpenTofu state and build artifacts. Versioned, private, encrypted, TLS
  # only. It is NOT tagged zenith:managed, so the deploy role cannot reconfigure
  # or delete it (explicit denies in ZenithDeployState as well). Deleting this
  # stack keeps the bucket: your state is yours.
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "zenith-state-${AWS::AccountId}-${AWS::Region}${NameSuffix}"
      VersioningConfiguration: { Status: Enabled }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: !If [HasKmsKey, true, !Ref "AWS::NoValue"]
            ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [HasKmsKey, "aws:kms", "AES256"]
              KMSMasterKeyID: !If [HasKmsKey, !Ref StateBucketKmsKeyArn, !Ref "AWS::NoValue"]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 180 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      Tags:
        - { Key: "zenith:bootstrap", Value: "true" }

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt StateBucket.Arn, !Sub "${StateBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - Sid: DenyTlsBelow12
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt StateBucket.Arn, !Sub "${StateBucket.Arn}/*"]
            Condition: { NumericLessThan: { "s3:TlsVersion": "1.2" } }

  # ------------------------------------------------- permission boundary
  # Every IAM role Zenith creates must carry this boundary. Effective
  # permissions of such a role = its own policies INTERSECT this list, so even a
  # role Zenith attaches AdministratorAccess to cannot exceed it. It grants
  # workload-level access (logs, image pull, zenith-* buckets/queues, secret
  # READS for injection) and denies IAM, Organizations and the state bucket.
  WorkloadBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ZenithWorkloadBoundary${NameSuffix}"
      Description: Permission boundary for roles created by Zenith. Do not edit; Zenith cannot.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WorkloadLogs
            Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/zenith/*"
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/*/zenith-*"
          - Sid: WorkloadImagePull
            Effect: Allow
            Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
            Resource: !Sub "arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/zenith-*"
          - Sid: WorkloadEcrAuth
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - Sid: WorkloadObjectsAndQueues
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:ChangeMessageVisibility
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::zenith-*"
              - !Sub "arn:${AWS::Partition}:s3:::zenith-*/*"
              - !Sub "arn:${AWS::Partition}:sqs:*:${AWS::AccountId}:zenith-*"
          - Sid: WorkloadReadItsOwnSecrets
            Effect: Allow
            Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret, ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
            Resource:
              - !Sub "arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:zenith/*"
              - !Sub "arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/zenith/*"
          - Sid: WorkloadKmsViaServices
            Effect: Allow
            Action: [kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
            Resource: "*"
            Condition:
              StringEquals: { "kms:CallerAccount": !Ref "AWS::AccountId" }
              StringLike:
                "kms:ViaService":
                  - "secretsmanager.*.amazonaws.com"
                  - "ssm.*.amazonaws.com"
                  - "s3.*.amazonaws.com"
                  - "sqs.*.amazonaws.com"
          - Sid: WorkloadVpcNetworkInterfaces
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: "*"
          - Sid: DenyIdentityOrgAndAccountAdministration
            Effect: Deny
            Action: ["iam:*", "organizations:*", "account:*"]
            Resource: "*"
          - Sid: DenyStateBucket
            Effect: Deny
            Action: "s3:*"
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub "${StateBucket.Arn}/*"

  # ---------------------------------------------------------- observe policy
  # Read-only. Attached to BOTH roles: OpenTofu needs to read the world to plan
  # and to refresh. Secret VALUES are explicitly denied.
  ObservePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ZenithObservePolicy${NameSuffix}"
      Description: Read-only access for Zenith (describe, list, get). No secret values.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DescribeAndList
            Effect: Allow
            Action:
              - ec2:Describe*
              - ecs:Describe*
              - ecs:List*
              - ecr:Describe*
              - ecr:List*
              - ecr:GetLifecyclePolicy
              - ecr:GetRepositoryPolicy
              - elasticloadbalancing:Describe*
              - rds:Describe*
              - rds:ListTagsForResource
              - elasticache:Describe*
              - elasticache:ListTagsForResource
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ListQueues
              - sqs:ListQueueTags
              - route53:Get*
              - route53:List*
              - acm:Describe*
              - acm:List*
              - cloudwatch:Describe*
              - cloudwatch:Get*
              - cloudwatch:List*
              - logs:Describe*
              - logs:ListTagsForResource
              - ssm:Describe*
              - secretsmanager:DescribeSecret
              - secretsmanager:ListSecrets
              - codebuild:BatchGet*
              - codebuild:List*
              - lambda:GetFunctionConfiguration
              - lambda:ListFunctions
              - lambda:ListTags
              - lambda:ListVersionsByFunction
              - lambda:ListAliases
              - lambda:GetAlias
              - events:Describe*
              - events:List*
              - cloudfront:GetDistribution
              - autoscaling:Describe*
              - application-autoscaling:Describe*
              - tag:GetResources
              - s3:ListAllMyBuckets
            Resource: "*"
          - Sid: ReadZenithLogs
            Effect: Allow
            Action: [logs:FilterLogEvents, logs:GetLogEvents, logs:StartQuery]
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/zenith/*"
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/*/zenith-*"
          - Sid: ReadLogQueryResults
            Effect: Allow
            Action: [logs:GetQueryResults, logs:StopQuery, logs:DescribeQueries]
            Resource: "*"
          - Sid: ReadZenithBuckets
            Effect: Allow
            Action:
              - s3:GetBucket*
              - s3:ListBucket
              - s3:GetEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:GetAccelerateConfiguration
              - s3:GetReplicationConfiguration
            Resource: !Sub "arn:${AWS::Partition}:s3:::zenith-*"
          - Sid: ReadZenithIam
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:ListRoleTags
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/zenith-*"
          - Sid: ReadTofuState
            Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion, s3:ListBucket, s3:ListBucketVersions]
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub "${StateBucket.Arn}/*"
          - !If
            - HasKmsKey
            - Sid: ReadStateKmsKey
              Effect: Allow
              Action: [kms:Decrypt, kms:DescribeKey]
              Resource: !Ref StateBucketKmsKeyArn
            - !Ref "AWS::NoValue"
          - Sid: NeverReadSecretValues
            Effect: Deny
            Action: [secretsmanager:GetSecretValue, ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
            Resource: "*"

  # ------------------------------------------------- deploy: network + EC2
  # Pattern used throughout: NEW resources must be created WITH the tag
  # zenith:managed=true (aws:RequestTag); EXISTING resources may be changed or
  # deleted only if they already carry it (aws:ResourceTag). The environment tag
  # is additionally matched against EnvironmentTagValue.
  DeployNetworkPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ZenithDeployNetwork${NameSuffix}"
      Description: Zenith deploy role - VPC and EC2 resources tagged zenith:managed.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Ec2CreateTaggedResources
            Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:CreateSubnet
              - ec2:CreateSecurityGroup
              - ec2:CreateRouteTable
              - ec2:CreateNetworkAcl
              - ec2:CreateInternetGateway
              - ec2:CreateEgressOnlyInternetGateway
              - ec2:CreateNatGateway
              - ec2:CreateVpcEndpoint
              - ec2:CreateLaunchTemplate
              - ec2:AllocateAddress
            Resource: !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:*/*"
            Condition:
              StringEquals: { "aws:RequestTag/zenith:managed": "true" }
              StringLike: { "aws:RequestTag/zenith:environment": !Ref EnvironmentTagValue }
          - Sid: Ec2TagOnCreate
            Effect: Allow
            Action: ec2:CreateTags
            Resource: !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:*/*"
            Condition:
              StringEquals:
                "aws:RequestTag/zenith:managed": "true"
                "ec2:CreateAction":
                  - CreateVpc
                  - CreateSubnet
                  - CreateSecurityGroup
                  - CreateRouteTable
                  - CreateNetworkAcl
                  - CreateInternetGateway
                  - CreateEgressOnlyInternetGateway
                  - CreateNatGateway
                  - CreateVpcEndpoint
                  - CreateLaunchTemplate
                  - AllocateAddress
                  - RunInstances
          - Sid: Ec2ModifyTaggedResources
            Effect: Allow
            Action:
              - ec2:DeleteVpc
              - ec2:ModifyVpcAttribute
              - ec2:DeleteSubnet
              - ec2:ModifySubnetAttribute
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
              - ec2:ModifySecurityGroupRules
              - ec2:UpdateSecurityGroupRuleDescriptionsIngress
              - ec2:UpdateSecurityGroupRuleDescriptionsEgress
              - ec2:DeleteRouteTable
              - ec2:CreateRoute
              - ec2:ReplaceRoute
              - ec2:DeleteRoute
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:DeleteNetworkAcl
              - ec2:CreateNetworkAclEntry
              - ec2:ReplaceNetworkAclEntry
              - ec2:DeleteNetworkAclEntry
              - ec2:DeleteInternetGateway
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:DeleteEgressOnlyInternetGateway
              - ec2:DeleteNatGateway
              - ec2:DeleteVpcEndpoints
              - ec2:ModifyVpcEndpoint
              - ec2:ReleaseAddress
              - ec2:AssociateAddress
              - ec2:DisassociateAddress
              - ec2:DeleteLaunchTemplate
              - ec2:CreateLaunchTemplateVersion
              - ec2:ModifyLaunchTemplate
              - ec2:DeleteLaunchTemplateVersions
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:StartInstances
              - ec2:StopInstances
              - ec2:RebootInstances
              - ec2:TerminateInstances
              - ec2:ModifyInstanceAttribute
            Resource: !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:*/*"
            Condition:
              StringEquals: { "aws:ResourceTag/zenith:managed": "true" }
              StringLike: { "aws:ResourceTag/zenith:environment": !Ref EnvironmentTagValue }
          - Sid: Ec2RunInstancesNewResources
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
              - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*"
              - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:volume/*"
              - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:network-interface/*"
            Condition:
              StringEquals: { "aws:RequestTag/zenith:managed": "true" }
              StringLike: { "aws:RequestTag/zenith:environment": !Ref EnvironmentTagValue }
          - Sid: Ec2RunInstancesInZenithNetworking
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
              - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:subnet/*"
              - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*"
              - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:launch-template/*"
            Condition:
              StringEquals: { "aws:ResourceTag/zenith:managed": "true" }
          - Sid: Ec2RunInstancesFromImages
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
              - !Sub "arn:${AWS::Partition}:ec2:*::image/*"
              - !Sub "arn:${AWS::Partition}:ec2:*::snapshot/*"
          - Sid: DenyChildResourcesInUntaggedVpc
            Effect: Deny
            Action:
              - ec2:CreateSubnet
              - ec2:CreateSecurityGroup
              - ec2:CreateRouteTable
              - ec2:CreateNetworkAcl
              - ec2:CreateVpcEndpoint
            Resource: !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/*"
            Condition:
              StringNotEquals: { "aws:ResourceTag/zenith:managed": "true" }
          - Sid: DenyNatGatewayInUntaggedSubnetOrAddress
            Effect: Deny
            Action: ec2:CreateNatGateway
            Resource:
              - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:subnet/*"
              - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:elastic-ip/*"
            Condition:
              StringNotEquals: { "aws:ResourceTag/zenith:managed": "true" }

  # ------------------------------------ deploy: load balancers and scaling
  # Separate managed policy: IAM caps one managed policy at 6,144 characters.
  DeployBalancingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ZenithDeployBalancing${NameSuffix}"
      Description: Zenith deploy role - load balancers, target groups and auto scaling groups named zenith-*.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ElbCreateTaggedLoadBalancersAndTargetGroups
            Effect: Allow
            Action: [elasticloadbalancing:CreateLoadBalancer, elasticloadbalancing:CreateTargetGroup]
            Resource:
              - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:loadbalancer/app/zenith-*/*"
              - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:loadbalancer/net/zenith-*/*"
              - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:targetgroup/zenith-*/*"
            Condition:
              StringEquals: { "aws:RequestTag/zenith:managed": "true" }
          - Sid: ElbManageZenithResources
            Effect: Allow
            Action:
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:SetSecurityGroups
              - elasticloadbalancing:SetSubnets
              - elasticloadbalancing:SetIpAddressType
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:ModifyTargetGroupAttributes
              - elasticloadbalancing:RegisterTargets
              - elasticloadbalancing:DeregisterTargets
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:AddListenerCertificates
              - elasticloadbalancing:RemoveListenerCertificates
              - elasticloadbalancing:CreateRule
              - elasticloadbalancing:DeleteRule
              - elasticloadbalancing:ModifyRule
              - elasticloadbalancing:SetRulePriorities
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:RemoveTags
            Resource:
              - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:loadbalancer/app/zenith-*/*"
              - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:loadbalancer/net/zenith-*/*"
              - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:targetgroup/zenith-*/*"
              - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:listener/app/zenith-*/*/*"
              - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:listener/net/zenith-*/*/*"
              - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:listener-rule/app/zenith-*/*/*/*"
              - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:listener-rule/net/zenith-*/*/*/*"
          - Sid: AutoScalingManageZenithGroups
            Effect: Allow
            Action:
              - autoscaling:CreateAutoScalingGroup
              - autoscaling:UpdateAutoScalingGroup
              - autoscaling:DeleteAutoScalingGroup
              - autoscaling:SetDesiredCapacity
              - autoscaling:PutScalingPolicy
              - autoscaling:DeletePolicy
              - autoscaling:PutLifecycleHook
              - autoscaling:DeleteLifecycleHook
              - autoscaling:CreateOrUpdateTags
              - autoscaling:DeleteTags
              - autoscaling:AttachLoadBalancerTargetGroups
              - autoscaling:DetachLoadBalancerTargetGroups
              - autoscaling:StartInstanceRefresh
              - autoscaling:CancelInstanceRefresh
              - autoscaling:TerminateInstanceInAutoScalingGroup
            Resource: !Sub "arn:${AWS::Partition}:autoscaling:*:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/zenith-*"

  # ---------------------------------------- deploy: containers, functions, CI
  DeployComputePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ZenithDeployCompute${NameSuffix}"
      Description: Zenith deploy role - ECS, ECR, Lambda, EventBridge rules and CodeBuild projects named zenith-*.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EcsCreateTaggedClustersAndServices
            Effect: Allow
            Action: [ecs:CreateCluster, ecs:CreateService, ecs:CreateCapacityProvider]
            Resource:
              - !Sub "arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:cluster/zenith-*"
              - !Sub "arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:service/zenith-*/*"
              - !Sub "arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:capacity-provider/zenith-*"
            Condition:
              StringEquals: { "aws:RequestTag/zenith:managed": "true" }
          - Sid: EcsManageZenithResources
            Effect: Allow
            Action:
              - ecs:UpdateCluster
              - ecs:UpdateClusterSettings
              - ecs:PutClusterCapacityProviders
              - ecs:DeleteCluster
              - ecs:UpdateService
              - ecs:DeleteService
              - ecs:UpdateCapacityProvider
              - ecs:DeleteCapacityProvider
              - ecs:RunTask
              - ecs:StopTask
              - ecs:TagResource
              - ecs:UntagResource
            Resource:
              - !Sub "arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:cluster/zenith-*"
              - !Sub "arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:service/zenith-*/*"
              - !Sub "arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:capacity-provider/zenith-*"
              - !Sub "arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:task/zenith-*/*"
              - !Sub "arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:task-definition/zenith-*:*"
          - Sid: EcsTaskDefinitionRevisions
            Effect: Allow
            Action: [ecs:RegisterTaskDefinition, ecs:DeregisterTaskDefinition]
            Resource: "*"
          - Sid: EcrManageZenithRepositories
            Effect: Allow
            Action:
              - ecr:CreateRepository
              - ecr:DeleteRepository
              - ecr:PutLifecyclePolicy
              - ecr:DeleteLifecyclePolicy
              - ecr:SetRepositoryPolicy
              - ecr:DeleteRepositoryPolicy
              - ecr:PutImageScanningConfiguration
              - ecr:PutImageTagMutability
              - ecr:BatchDeleteImage
              - ecr:TagResource
              - ecr:UntagResource
            Resource: !Sub "arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/zenith-*"
          - Sid: LambdaCreateTaggedFunctions
            Effect: Allow
            Action: lambda:CreateFunction
            Resource: !Sub "arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:zenith-*"
            Condition:
              StringEquals: { "aws:RequestTag/zenith:managed": "true" }
          - Sid: LambdaManageZenithFunctions
            Effect: Allow
            Action:
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:DeleteFunction
              - lambda:PublishVersion
              - lambda:CreateAlias
              - lambda:UpdateAlias
              - lambda:DeleteAlias
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:PutFunctionConcurrency
              - lambda:DeleteFunctionConcurrency
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:InvokeFunction
              - lambda:GetFunction
              - lambda:GetPolicy
            Resource:
              - !Sub "arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:zenith-*"
              - !Sub "arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:zenith-*:*"
          - Sid: EventBridgeManageZenithRules
            Effect: Allow
            Action:
              - events:PutRule
              - events:DeleteRule
              - events:EnableRule
              - events:DisableRule
              - events:PutTargets
              - events:RemoveTargets
              - events:TagResource
              - events:UntagResource
            Resource:
              - !Sub "arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/zenith-*"
              - !Sub "arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/*/zenith-*"
          - Sid: CodeBuildManageZenithProjects
            Effect: Allow
            Action:
              - codebuild:CreateProject
              - codebuild:UpdateProject
              - codebuild:DeleteProject
              - codebuild:StartBuild
              - codebuild:StopBuild
              - codebuild:BatchGetBuilds
              - codebuild:BatchGetProjects
            Resource: !Sub "arn:${AWS::Partition}:codebuild:*:${AWS::AccountId}:project/zenith-*"

  # ------------------------------------------------ deploy: data and edge
  DeployDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ZenithDeployData${NameSuffix}"
      Description: Zenith deploy role - RDS, ElastiCache, S3 buckets, SQS and secret containers named zenith-*.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RdsCreateTaggedResources
            Effect: Allow
            Action:
              - rds:CreateDBInstance
              - rds:CreateDBCluster
              - rds:CreateDBInstanceReadReplica
              - rds:CreateDBSubnetGroup
              - rds:CreateDBParameterGroup
              - rds:CreateDBClusterParameterGroup
              - rds:CreateOptionGroup
              - rds:RestoreDBInstanceFromDBSnapshot
              - rds:RestoreDBClusterFromSnapshot
            Resource:
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:db:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:subgrp:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:pg:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster-pg:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:og:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:snapshot:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster-snapshot:zenith-*"
            Condition:
              StringEquals: { "aws:RequestTag/zenith:managed": "true" }
          - Sid: RdsManageZenithResources
            Effect: Allow
            Action:
              - rds:ModifyDBInstance
              - rds:DeleteDBInstance
              - rds:RebootDBInstance
              - rds:StartDBInstance
              - rds:StopDBInstance
              - rds:ModifyDBCluster
              - rds:DeleteDBCluster
              - rds:ModifyDBSubnetGroup
              - rds:DeleteDBSubnetGroup
              - rds:ModifyDBParameterGroup
              - rds:ResetDBParameterGroup
              - rds:DeleteDBParameterGroup
              - rds:ModifyDBClusterParameterGroup
              - rds:DeleteDBClusterParameterGroup
              - rds:ModifyOptionGroup
              - rds:DeleteOptionGroup
              - rds:CreateDBSnapshot
              - rds:CreateDBClusterSnapshot
              - rds:DeleteDBSnapshot
              - rds:DeleteDBClusterSnapshot
              - rds:AddTagsToResource
              - rds:RemoveTagsFromResource
            Resource:
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:db:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:subgrp:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:pg:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster-pg:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:og:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:snapshot:zenith-*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster-snapshot:zenith-*"
          - Sid: ElastiCacheCreateTaggedResources
            Effect: Allow
            Action:
              - elasticache:CreateCacheCluster
              - elasticache:CreateReplicationGroup
              - elasticache:CreateCacheSubnetGroup
              - elasticache:CreateCacheParameterGroup
            Resource:
              - !Sub "arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:cluster:zenith-*"
              - !Sub "arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:replicationgroup:zenith-*"
              - !Sub "arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:subnetgroup:zenith-*"
              - !Sub "arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:parametergroup:zenith-*"
            Condition:
              StringEquals: { "aws:RequestTag/zenith:managed": "true" }
          - Sid: ElastiCacheManageZenithResources
            Effect: Allow
            Action:
              - elasticache:ModifyCacheCluster
              - elasticache:DeleteCacheCluster
              - elasticache:RebootCacheCluster
              - elasticache:ModifyReplicationGroup
              - elasticache:DeleteReplicationGroup
              - elasticache:IncreaseReplicaCount
              - elasticache:DecreaseReplicaCount
              - elasticache:ModifyCacheSubnetGroup
              - elasticache:DeleteCacheSubnetGroup
              - elasticache:ModifyCacheParameterGroup
              - elasticache:ResetCacheParameterGroup
              - elasticache:DeleteCacheParameterGroup
              - elasticache:CreateSnapshot
              - elasticache:DeleteSnapshot
              - elasticache:AddTagsToResource
              - elasticache:RemoveTagsFromResource
            Resource:
              - !Sub "arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:cluster:zenith-*"
              - !Sub "arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:replicationgroup:zenith-*"
              - !Sub "arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:subnetgroup:zenith-*"
              - !Sub "arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:parametergroup:zenith-*"
              - !Sub "arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:snapshot:zenith-*"
          - Sid: S3ManageZenithBuckets
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:PutBucketTagging
              - s3:PutBucketVersioning
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutEncryptionConfiguration
              - s3:PutBucketPublicAccessBlock
              - s3:PutLifecycleConfiguration
              - s3:PutBucketCORS
              - s3:PutBucketOwnershipControls
            Resource: !Sub "arn:${AWS::Partition}:s3:::zenith-*"
          - Sid: SqsManageZenithQueues
            Effect: Allow
            Action: [sqs:CreateQueue, sqs:DeleteQueue, sqs:SetQueueAttributes, sqs:TagQueue, sqs:UntagQueue]
            Resource: !Sub "arn:${AWS::Partition}:sqs:*:${AWS::AccountId}:zenith-*"
          - Sid: SecretContainersOnly
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:UpdateSecret
              - secretsmanager:DeleteSecret
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
            Resource: !Sub "arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:zenith/*"

  # ---------------------------------------- deploy: logs, alarms, DNS, certificates
  DeployEdgePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ZenithDeployEdge${NameSuffix}"
      Description: Zenith deploy role - log groups and alarms named zenith-*, certificates tagged zenith:managed, DNS records in listed zones.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LogsManageZenithGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/zenith/*"
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/*/zenith-*"
          - Sid: CloudWatchAlarmsZenith
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:EnableAlarmActions
              - cloudwatch:DisableAlarmActions
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
            Resource: !Sub "arn:${AWS::Partition}:cloudwatch:*:${AWS::AccountId}:alarm:zenith-*"
          - Sid: AcmRequestTaggedCertificates
            Effect: Allow
            Action: [acm:RequestCertificate, acm:AddTagsToCertificate]
            Resource: "*"
            Condition:
              StringEquals: { "aws:RequestTag/zenith:managed": "true" }
          - Sid: AcmManageTaggedCertificates
            Effect: Allow
            Action: [acm:DeleteCertificate, acm:AddTagsToCertificate, acm:RemoveTagsFromCertificate, acm:UpdateCertificateOptions]
            Resource: !Sub "arn:${AWS::Partition}:acm:*:${AWS::AccountId}:certificate/*"
            Condition:
              StringEquals: { "aws:ResourceTag/zenith:managed": "true" }
          - !If
            - HasHostedZones
            - Sid: Route53ChangeRecordsInListedZones
              Effect: Allow
              Action: route53:ChangeResourceRecordSets
              Resource: !Ref Route53HostedZoneArns
            - !Ref "AWS::NoValue"

  # -------------------------------------------------------- deploy: state
  DeployStatePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ZenithDeployState${NameSuffix}"
      Description: Zenith deploy role - OpenTofu state and artifacts in the state bucket; cannot reconfigure or empty it.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StateObjects
            Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:DeleteObject]
            Resource: !Sub "${StateBucket.Arn}/*"
          - Sid: StateBucketRead
            Effect: Allow
            Action: [s3:ListBucket, s3:ListBucketVersions, s3:GetBucketLocation, s3:GetBucketVersioning]
            Resource: !GetAtt StateBucket.Arn
          - !If
            - HasKmsKey
            - Sid: StateKmsKey
              Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
              Resource: !Ref StateBucketKmsKeyArn
            - !Ref "AWS::NoValue"
          - Sid: DenyStateBucketAdministration
            Effect: Deny
            Action:
              - s3:DeleteBucket
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutBucketVersioning
              - s3:PutEncryptionConfiguration
              - s3:PutBucketPublicAccessBlock
              - s3:PutLifecycleConfiguration
              - s3:PutBucketOwnershipControls
              - s3:PutBucketAcl
              - s3:PutBucketTagging
            Resource: !GetAtt StateBucket.Arn
          - Sid: DenyStateHistoryDeletion
            Effect: Deny
            Action: s3:DeleteObjectVersion
            Resource: !Sub "${StateBucket.Arn}/*"

  # ---------------------------------------------------------- deploy: IAM
  # The only IAM Zenith can perform: create/attach/detach/pass roles named
  # zenith-* that carry the ZenithWorkloadBoundary boundary. Anything else in IAM
  # is unreachable, and the last statements deny the escalation paths outright.
  DeployIamPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ZenithDeployIam${NameSuffix}"
      Description: Zenith deploy role - bounded IAM for zenith-* roles, PassRole, and self-protection denies.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: IamCreateBoundedRoles
            Effect: Allow
            Action: iam:CreateRole
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*"
            Condition:
              StringEquals:
                "iam:PermissionsBoundary": !Ref WorkloadBoundary
                "aws:RequestTag/zenith:managed": "true"
          - Sid: IamChangeBoundedRolePolicies
            Effect: Allow
            Action:
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:DeleteRole
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*"
            Condition:
              StringEquals: { "iam:PermissionsBoundary": !Ref WorkloadBoundary }
          - Sid: IamAttachOnlyKnownPolicies
            Effect: Allow
            Action: iam:AttachRolePolicy
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*"
            Condition:
              StringEquals: { "iam:PermissionsBoundary": !Ref WorkloadBoundary }
              ArnLike:
                "iam:PolicyARN":
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/zenith-*"
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
          - Sid: IamTagRolesOnCreation
            Effect: Allow
            Action: iam:TagRole
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*"
            Condition:
              StringEquals: { "aws:RequestTag/zenith:managed": "true" }
          - Sid: IamRoleMetadata
            Effect: Allow
            Action: [iam:TagRole, iam:UntagRole, iam:UpdateRole, iam:UpdateRoleDescription, iam:UpdateAssumeRolePolicy]
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*"
            Condition:
              StringEquals: { "aws:ResourceTag/zenith:managed": "true" }
          - Sid: IamManageZenithPolicies
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:TagPolicy
              - iam:UntagPolicy
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/zenith-*"
          - Sid: IamPassRoleToWorkloadServices
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-*"
            Condition:
              StringEquals:
                "iam:PassedToService": [ecs-tasks.amazonaws.com, codebuild.amazonaws.com, lambda.amazonaws.com]
          - Sid: IamServiceLinkedRolesForSupportedServices
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*"
            Condition:
              StringEquals:
                "iam:AWSServiceName":
                  - ecs.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
                  - autoscaling.amazonaws.com
                  - rds.amazonaws.com
                  - elasticache.amazonaws.com
          - Sid: DenyModifyingZenithBootstrapRolesAndPolicies
            Effect: Deny
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateRole
              - iam:UpdateRoleDescription
              - iam:DeleteRole
              - iam:TagRole
              - iam:UntagRole
              - iam:PutRolePermissionsBoundary
              - iam:DeleteRolePermissionsBoundary
              - iam:CreatePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ZenithDeploy*"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ZenithObserve*"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zenith-codebuild*"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/ZenithDeploy*"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/ZenithObserve*"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/ZenithWorkloadBoundary*"
          - Sid: DenyRemovingAnyPermissionsBoundary
            Effect: Deny
            Action: [iam:DeleteRolePermissionsBoundary, iam:PutRolePermissionsBoundary]
            Resource: "*"
            Condition:
              StringNotEquals: { "iam:PermissionsBoundary": !Ref WorkloadBoundary }
          - Sid: DenyOidcProviderAndPrincipalCreation
            Effect: Deny
            Action:
              - iam:CreateOpenIDConnectProvider
              - iam:DeleteOpenIDConnectProvider
              - iam:UpdateOpenIDConnectProviderThumbprint
              - iam:AddClientIDToOpenIDConnectProvider
              - iam:RemoveClientIDFromOpenIDConnectProvider
              - iam:CreateSAMLProvider
              - iam:CreateUser
              - iam:CreateAccessKey
              - iam:CreateLoginProfile
              - organizations:*
              - account:*
            Resource: "*"

  # ------------------------------------------------------------------ roles
  ObserveRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ZenithObserveRole${NameSuffix}"
      Description: Read-only role assumed by Zenith to inspect this account.
      MaxSessionDuration: 3600
      ManagedPolicyArns: [!Ref ObservePolicy]
      AssumeRolePolicyDocument: !Sub
        - '{"Version":"2012-10-17","Statement":[${Statements}]}'
        - Statements: !Join
            - ","
            - - !If
                - HasOidc
                - !Sub '{"Sid":"ZenithOidc","Effect":"Allow","Principal":{"Federated":"arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${ZenithIssuerHost}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"${ZenithIssuerHost}:aud":"sts.amazonaws.com","${ZenithIssuerHost}:sub":"${ZenithOidcSubject}"},"StringLike":{"sts:RoleSessionName":"zenith-*"}}}'
                - !Ref "AWS::NoValue"
              - !If
                - HasOidc
                - !Sub '{"Sid":"ZenithOidcTagSession","Effect":"Allow","Principal":{"Federated":"arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${ZenithIssuerHost}"},"Action":"sts:TagSession","Condition":{"StringEquals":{"${ZenithIssuerHost}:aud":"sts.amazonaws.com","${ZenithIssuerHost}:sub":"${ZenithOidcSubject}"}}}'
                - !Ref "AWS::NoValue"
              - !If
                - HasAssumeRole
                - !Sub '{"Sid":"ZenithAssumeRole","Effect":"Allow","Principal":{"AWS":"${ZenithPrincipalArn}"},"Action":"sts:AssumeRole","Condition":{"StringEquals":{"sts:ExternalId":"${ExternalId}"},"StringLike":{"sts:RoleSessionName":"zenith-*"}}}'
                - !Ref "AWS::NoValue"
              - !If
                - HasAssumeRole
                - !Sub '{"Sid":"ZenithTagSession","Effect":"Allow","Principal":{"AWS":"${ZenithPrincipalArn}"},"Action":"sts:TagSession"}'
                - !Ref "AWS::NoValue"
      Tags:
        - { Key: "zenith:bootstrap", Value: "true" }

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ZenithDeployRole${NameSuffix}"
      Description: Role assumed by Zenith to change resources tagged zenith:managed. Bounded; cannot modify itself.
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - !Ref ObservePolicy
        - !Ref DeployNetworkPolicy
        - !Ref DeployBalancingPolicy
        - !Ref DeployComputePolicy
        - !Ref DeployDataPolicy
        - !Ref DeployEdgePolicy
        - !Ref DeployStatePolicy
        - !Ref DeployIamPolicy
      AssumeRolePolicyDocument: !Sub
        - '{"Version":"2012-10-17","Statement":[${Statements}]}'
        - Statements: !Join
            - ","
            - - !If
                - HasOidc
                - !Sub '{"Sid":"ZenithOidc","Effect":"Allow","Principal":{"Federated":"arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${ZenithIssuerHost}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"${ZenithIssuerHost}:aud":"sts.amazonaws.com","${ZenithIssuerHost}:sub":"${ZenithOidcSubject}"},"StringLike":{"sts:RoleSessionName":"zenith-*"}}}'
                - !Ref "AWS::NoValue"
              - !If
                - HasOidc
                - !Sub '{"Sid":"ZenithOidcTagSession","Effect":"Allow","Principal":{"Federated":"arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${ZenithIssuerHost}"},"Action":"sts:TagSession","Condition":{"StringEquals":{"${ZenithIssuerHost}:aud":"sts.amazonaws.com","${ZenithIssuerHost}:sub":"${ZenithOidcSubject}"}}}'
                - !Ref "AWS::NoValue"
              - !If
                - HasAssumeRole
                - !Sub '{"Sid":"ZenithAssumeRole","Effect":"Allow","Principal":{"AWS":"${ZenithPrincipalArn}"},"Action":"sts:AssumeRole","Condition":{"StringEquals":{"sts:ExternalId":"${ExternalId}"},"StringLike":{"sts:RoleSessionName":"zenith-*"}}}'
                - !Ref "AWS::NoValue"
              - !If
                - HasAssumeRole
                - !Sub '{"Sid":"ZenithTagSession","Effect":"Allow","Principal":{"AWS":"${ZenithPrincipalArn}"},"Action":"sts:TagSession"}'
                - !Ref "AWS::NoValue"
      Tags:
        - { Key: "zenith:bootstrap", Value: "true" }

  # Separate from deploy: no GetSecretValue, infrastructure or IAM permissions.
  # Both name shapes are required: current drivers use zenith/zenith-<env>-<node>.
  SecretWriterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ZenithSecretWriterRole${NameSuffix}"
      Description: Brokered secret.write only; exact per-node session policy required by Zenith.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - '{"Version":"2012-10-17","Statement":[${Statements}]}'
        - Statements: !Join
            - ","
            - - !If
                - HasOidc
                - !Sub '{"Sid":"ZenithOidc","Effect":"Allow","Principal":{"Federated":"arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${ZenithIssuerHost}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"${ZenithIssuerHost}:aud":"sts.amazonaws.com","${ZenithIssuerHost}:sub":"${ZenithOidcSubject}"},"StringLike":{"sts:RoleSessionName":"zenith-*"}}}'
                - !Ref "AWS::NoValue"
              - !If
                - HasOidc
                - !Sub '{"Sid":"ZenithOidcTagSession","Effect":"Allow","Principal":{"Federated":"arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${ZenithIssuerHost}"},"Action":"sts:TagSession","Condition":{"StringEquals":{"${ZenithIssuerHost}:aud":"sts.amazonaws.com","${ZenithIssuerHost}:sub":"${ZenithOidcSubject}"}}}'
                - !Ref "AWS::NoValue"
              - !If
                - HasAssumeRole
                - !Sub '{"Sid":"ZenithAssumeRole","Effect":"Allow","Principal":{"AWS":"${ZenithPrincipalArn}"},"Action":"sts:AssumeRole","Condition":{"StringEquals":{"sts:ExternalId":"${ExternalId}"},"StringLike":{"sts:RoleSessionName":"zenith-*"}}}'
                - !Ref "AWS::NoValue"
              - !If
                - HasAssumeRole
                - !Sub '{"Sid":"ZenithTagSession","Effect":"Allow","Principal":{"AWS":"${ZenithPrincipalArn}"},"Action":"sts:TagSession"}'
                - !Ref "AWS::NoValue"
      Policies:
        - PolicyName: ZenithSecretWriter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteEnvironmentSecretValues
                Effect: Allow
                Action: [secretsmanager:DescribeSecret, secretsmanager:PutSecretValue, secretsmanager:UpdateSecretVersionStage]
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:zenith/${EnvironmentTagValue}/*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:zenith/zenith-${EnvironmentTagValue}-*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/zenith:managed": "true"
                    "aws:PrincipalTag/zenith:capability": "secret.write"
                  StringLike:
                    "aws:ResourceTag/zenith:environment": !Ref EnvironmentTagValue
      Tags:
        - { Key: "zenith:bootstrap", Value: "true" }

  # ---------------------------------------------------- CodeBuild service role
  # Builds run in YOUR account (ADR-0016). Lower-case name so the deploy role
  # may pass it to zenith-* CodeBuild projects; the deploy role is explicitly
  # denied any change to it.
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "zenith-codebuild${NameSuffix}"
      Description: Service role for Zenith CodeBuild projects (image builds).
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      Policies:
        - PolicyName: zenith-codebuild-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BuildLogs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/codebuild/zenith-*"
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/codebuild/zenith-*:*"
              - Sid: PushImagesToZenithRepositories
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub "arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/zenith-*"
              - Sid: EcrLoginToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: ReadBuildArtifacts
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "${StateBucket.Arn}/artifacts/*"
              - Sid: ListArtifactPrefix
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt StateBucket.Arn
                Condition:
                  StringLike: { "s3:prefix": ["artifacts/*"] }
              - !If
                - HasKmsKey
                - Sid: DecryptArtifacts
                  Effect: Allow
                  Action: [kms:Decrypt, kms:DescribeKey]
                  Resource: !Ref StateBucketKmsKeyArn
                - !Ref "AWS::NoValue"
      Tags:
        - { Key: "zenith:bootstrap", Value: "true" }

Outputs:
  ObserveRoleArn:
    Description: Give this to Zenith as the observe role ARN.
    Value: !GetAtt ObserveRole.Arn
  DeployRoleArn:
    Description: Give this to Zenith as the deploy role ARN.
    Value: !GetAtt DeployRole.Arn
  SecretWriterRoleArn:
    Description: Give this to Zenith as secretWriterRoleArn, separate from deployRoleArn.
    Value: !GetAtt SecretWriterRole.Arn
  StateBucketName:
    Description: Bucket for OpenTofu state and build artifacts.
    Value: !Ref StateBucket
  CodeBuildRoleArn:
    Description: Service role for Zenith CodeBuild projects.
    Value: !GetAtt CodeBuildRole.Arn
  WorkloadBoundaryArn:
    Description: Permission boundary every Zenith-created role must carry.
    Value: !Ref WorkloadBoundary
  OidcProviderArn:
    Condition: HasOidc
    Description: The IAM OIDC provider the trust policies reference.
    Value: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${ZenithIssuerHost}"
  AccountId:
    Description: The AWS account id this stack lives in.
    Value: !Ref "AWS::AccountId"
  Region:
    Description: The region of the state bucket.
    Value: !Ref "AWS::Region"
