# AKS with Microsoft Entra Workload Identity. OpenTofu providers use the Azure
# identity; there is no Azure proxy kind, so only tofu.run and the probes are enabled.
serviceAccount:
  annotations:
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
podLabels:
  azure.workload.identity/use: "true"
config:
  labels:
    cloud: azure
  kinds:
    tofu.run:
      enabled: true
      binary: /usr/local/bin/tofu
