# Engine fixture ONLY. Product/auth still require a real isolated Supabase
# project. Temporal CLI's SQLite dev server has no production HA guarantee.
x-ownership: &ownership
  io.zenith.installation: ${ZENITH_INSTALLATION_ID:?prepare private configuration}
services:
  api:
    depends_on:
      platform-db: {condition: service_healthy}
      temporal: {condition: service_healthy}
  execution-worker:
    depends_on:
      platform-db: {condition: service_healthy}
      temporal: {condition: service_healthy}
  platform-migrate:
    depends_on:
      platform-db: {condition: service_healthy}
  platform-db:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    env_file:
      - path: ${ZENITH_PRIVATE_DIR:?prepare private configuration}/platform.env
        format: raw
    volumes: [platform-data:/var/lib/postgresql/data]
    networks: [installation]
    labels: *ownership
    cap_drop: [NET_RAW]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d zenith_platform']
      interval: 5s
      timeout: 3s
      retries: 20
  temporal:
    image: temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    user: '1000:1000'
    command: [server, start-dev, --ip, 0.0.0.0, --port, '7233', --namespace, zenith-disposable, --db-filename, /home/temporal/temporal.db, --headless]
    volumes: [temporal-data:/home/temporal]
    networks: [installation]
    labels: *ownership
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000,mode=1770']
    cpus: 1
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, '127.0.0.1:7233']
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
volumes:
  platform-data: {labels: *ownership}
  temporal-data: {labels: *ownership}
