# Engine fixture ONLY. All schemas/auth require one real isolated Supabase
# project. Temporal CLI's SQLite dev server has no production HA guarantee.
x-ownership: &ownership
  io.zenith.installation: ${ZENITH_INSTALLATION_ID:?prepare private configuration}
services:
  api:
    depends_on:
      temporal: {condition: service_healthy}
  execution-worker:
    depends_on:
      temporal: {condition: service_healthy}
  temporal:
    image: temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    user: '1000:1000'
    command: [server, start-dev, --ip, 0.0.0.0, --port, '7233', --namespace, zenith-disposable, --db-filename, /home/temporal/temporal.db, --headless]
    volumes: [temporal-data:/home/temporal]
    networks: [installation]
    labels: *ownership
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000,mode=1770']
    cpus: 1
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, '127.0.0.1:7233']
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
volumes:
  temporal-data: {labels: *ownership}
