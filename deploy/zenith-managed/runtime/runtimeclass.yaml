apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: zenith-gvisor
  labels:
    zenith.dev/runtime-installation: kind-j14
handler: runsc
# Provisional overhead, charged to tenant quotas; measure before production sizing.
overhead:
  podFixed:
    cpu: 50m
    memory: 64Mi
scheduling:
  nodeSelector:
    zenith.dev/runtime: gvisor
