<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gimbal · Orrery</title><style>:root{color-scheme:dark;--bg:#080c14;--line:#202938;--muted:#9ba8bc;--accent:#b89cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e7edf7;font:14px system-ui,sans-serif}main{max-width:960px;margin:auto;padding:40px 20px}header{border-bottom:1px solid var(--line);padding-bottom:24px}h1{font-size:28px;margin:0}p{color:var(--muted);line-height:1.6}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.controls button{background:transparent;border:1px solid transparent;border-radius:8px;color:var(--muted);padding:9px 12px;cursor:pointer}.controls button.active{background:#1b2130;border-color:#303b52;color:#fff}.stage{display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:40px;border-block:1px solid var(--line);padding:28px 0}.gyro{height:360px;display:grid;place-items:center}.gyro svg{width:100%;height:100%}.ring{transform-origin:128px 128px;animation:orbit 13s linear infinite}.r2{animation-duration:17s;animation-direction:reverse}.r3{animation-duration:22s}@keyframes orbit{to{transform:rotate(360deg)}}.still .ring{animation-play-state:paused}@media(max-width:620px){main{padding:28px 18px}.stage{grid-template-columns:1fr;gap:12px}.gyro{height:280px}}</style><main><header><h1>Gimbal</h1><p>A quiet presence, always in orbit.</p></header><section><h2>State preview</h2><div class="controls" id="modes"><button class="active">Automatic</button><button>Still</button><button>Low power</button></div><div class="controls" id="states"></div><div class="stage"><figure class="gyro" aria-label="Gimbal gyroscope"><svg viewBox="0 0 256 256"><g fill="none" stroke="#8999b2" stroke-width="2"><ellipse class="ring" cx="128" cy="128" rx="108" ry="84" transform="rotate(32 128 128)"/><ellipse class="ring r2" cx="128" cy="128" rx="88" ry="54" transform="rotate(-48 128 128)"/><ellipse class="ring r3" cx="128" cy="128" rx="67" ry="53" transform="rotate(14 128 128)"/></g><ellipse cx="128" cy="128" rx="42" ry="35" fill="#364154"/><ellipse cx="128" cy="127" rx="37" ry="28" fill="#080e19"/><g fill="#ffd69c"><rect x="110" y="118" width="8" height="15" rx="4"/><rect x="138" y="118" width="8" height="15" rx="4"/></g><path id="mouth" d="M121 140 Q128 142 135 140" fill="none" stroke="#ffd69c" stroke-width="1.6" stroke-linecap="round"/></svg></figure><div><strong id="label" style="color:var(--accent)">Planning</strong><p id="desc">A focused gaze. The rings gently explore different orientations.</p></div></div><p>Choose a state to feel the orbit shift, then settle. Hover or tap the face for a small response.</p></section></main><script>let statesEl=null;const states={Planning:['#b89cff','A focused gaze. The rings gently explore different orientations.'],'Awaiting approval':['#e6bc69','An open, attentive expression. A calm orbit while the decision is yours.'],Applying:['#79baff','A little more focus and momentum, with the same quiet rhythm.'],Verified:['#86d6aa','A small smile. The rings ease back down into their unhurried orbit.'],Blocked:['#ee8b8b','A thoughtful expression. The orbit softens while something needs attention.']};let cur='Planning';for(const n in states){const b=document.createElement('button');b.textContent=n;b.onclick=()=>{cur=n;document.documentElement.style.setProperty('--accent',states[n][0]);label.textContent=n;desc.textContent=states[n][1];document.querySelectorAll('#states button').forEach(x=>x.classList.toggle('active',x===b));mouth.setAttribute('d',n==='Verified'?'M121 138 Q128 146 135 138':n==='Blocked'?'M121 140 Q128 138 135 140':'M121 140 Q128 142 135 140')};statesEl=statesEl||null;document.querySelector('#states').append(b)}document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{document.body.classList.toggle('still',b.textContent!=='Automatic');document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('#states button').click()</script></html>
